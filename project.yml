name: PromptCam
options:
  bundleIdPrefix: org.example.promptcam
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    GENERATE_INFOPLIST_FILE: true
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    CODE_SIGN_STYLE: Automatic
    # 真机运行：在 Xcode 中选择自己的 Team，并更换唯一 Bundle Identifier。
    INFOPLIST_KEY_CFBundleDisplayName: "口播相机公开版"
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UIStatusBarHidden: true
    INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: false
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_UIUserInterfaceStyle: Dark
    INFOPLIST_KEY_NSCameraUsageDescription: "用于录制口播视频。"
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "用于录制口播视频的声音,并识别你读到了哪一句以自动滚动提词器。"
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "用于识别你读到了脚本的哪一句,实现提词器自动跟读滚动。识别全程在本机完成,不会上传任何音频。"
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "用于把录制好的口播视频保存到相册。"

targets:
  PromptCam:
    type: application
    platform: iOS
    sources:
      - path: PromptCam/Sources
      - path: PromptCam/Resources
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.promptcam.open
        TARGETED_DEVICE_FAMILY: "1"

  PromptCamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PromptCamTests
      - path: PromptCam/Sources/Align/ScriptLanguage.swift
      - path: PromptCam/Sources/Align/ScriptTokenizer.swift
      - path: PromptCam/Sources/Align/ReadingAligner.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.promptcam.open.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true

  PromptCamUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PromptCamUITests
    dependencies:
      - target: PromptCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.promptcam.open.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true

schemes:
  PromptCam:
    build:
      targets:
        PromptCam: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PromptCamTests
        - PromptCamUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
